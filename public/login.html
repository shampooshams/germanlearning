<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>easyypeasyyGerman — sign in</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .page {
    max-width: 460px;
    margin: 0 auto;
    padding: 0 1.25rem 3rem;
  }
  .auth-card {
    padding: 2rem 1.75rem 1.75rem;
  }
  .auth-card .headline {
    font-size: 1.6rem;
    text-align: center;
    color: var(--ink);
  }
  .auth-card .caption {
    text-align: center;
    margin-top: 0.4rem;
  }
  .tabs {
    display: flex;
    margin: 1.5rem 0 1.5rem;
    background: rgba(28,28,28,0.06);
    border-radius: 3px;
    padding: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 0.6rem;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: lowercase;
    border-radius: 2px;
    cursor: pointer;
    color: var(--ink);
  }
  .tab-btn.active {
    background: var(--mustard);
    color: var(--navy-dark);
  }
  .field-group { margin-bottom: 1.1rem; }
  .row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .switch-line {
    text-align: center;
    margin-top: 1.25rem;
    font-size: 0.85rem;
    color: var(--ink);
  }
</style>
</head>
<body>
  <div class="app-header">
    <div class="headline">easyy peasyy german</div>
    <p class="caption">learn german, one word at a time</p>
  </div>

  <div class="page">
    <div class="card auth-card">
      <h1 class="headline">easyy peasyy german</h1>
      <p class="caption" id="form-caption">sign in to continue your progress</p>

      <div class="tabs">
        <button class="tab-btn active" id="tab-signin" type="button">sign in</button>
        <button class="tab-btn" id="tab-signup" type="button">sign up</button>
      </div>

      <form id="auth-form">
        <div class="field-group">
          <label class="field-label" for="email">email</label>
          <input class="field-input" type="email" id="email" required autocomplete="email">
        </div>
        <div class="field-group">
          <div class="row-between">
            <label class="field-label" for="password">password</label>
            <span class="link-terracotta" id="forgot-link" style="font-size:0.75rem;">forgot?</span>
          </div>
          <input class="field-input" type="password" id="password" required autocomplete="current-password" minlength="6">
        </div>

        <p class="error-text" id="error-text"></p>

        <button class="btn btn-primary" type="submit" id="submit-btn" style="width:100%;">sign in</button>
      </form>

      <p class="switch-line">
        <span id="switch-prompt">don't have an account?</span>
        <button class="link-terracotta" id="switch-link" type="button">sign up</button>
      </p>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
