<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>easyypeasyyGerman - vocabulary found</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .review-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.25rem;
  }
  .review-header .headline { font-size: 1.35rem; }
  .review-card { padding: 1.5rem 1.5rem 1.75rem; }
  .section-label {
    display: inline-block;
    background: var(--mustard);
    color: var(--navy-dark);
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.25rem 0.65rem;
    border-radius: 2px;
    margin: 1.5rem 0 0.75rem;
  }
  .section-label:first-of-type { margin-top: 0.25rem; }
  .word-row {
    padding: 0.9rem 0;
    border-bottom: 1px solid var(--border);
  }
  .word-badges { display: flex; gap: 0.4rem; margin-bottom: 0.4rem; }
  .badge {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.18rem 0.5rem;
    border-radius: 3px;
  }
  .badge-level { background: var(--mustard); color: var(--navy-dark); }
  .badge-type { background: rgba(28,28,28,0.08); color: #444; }
  .word-main { font-weight: 700; font-size: 1rem; }
  .word-translation { font-weight: 500; color: #4a4a4a; }
  .word-plural { font-size: 0.78rem; color: #6a6a6a; margin-top: 0.15rem; }
  .word-note { font-size: 0.82rem; color: #444; margin-top: 0.35rem; }
  .word-example { font-size: 0.85rem; color: var(--terracotta); margin-top: 0.4rem; font-style: italic; }
  .word-example .en { color: #6a6a6a; font-style: normal; display: block; margin-top: 0.15rem; }
  .word-conj { font-size: 0.78rem; color: #444; margin-top: 0.35rem; }
  .review-more { text-align: center; margin-top: 1.5rem; }
  .empty-state { color: var(--cream); text-align: center; padding: 3rem 1rem; }
  .empty-state a { color: var(--mustard); }
</style>
</head>
<body>
  <div id="nav-root"></div>

  <div class="page-wrap">
    <div id="content"></div>
  </div>

  <script type="module" src="js/review.js"></script>
</body>
</html>
